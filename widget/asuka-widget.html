<div class="asw" id="asw" data-ship="asuka3" data-page="asuka-status" data-nosnippet>
  <div class="asw-head"><b>飛鳥III 販売中のクルーズと旅行会社別の空室</b><span id="asw-upd">空室は毎週更新</span></div>
  <div class="asw-bar">
    <select id="asw-month" aria-label="出発月"><option value="">出発月：すべて</option></select>
    <select id="asw-port" aria-label="発着港"><option value="">発着港：すべて</option></select>
    <span class="asw-hint" id="asw-hint"></span>
    <span class="asw-lg"><span class="ok">○</span>予約可 <span class="few">△</span>残りわずか <span class="ng">✕</span>満室・キャンセル待ち <span class="ans">◇</span>リクエスト（申込後に回答） <span class="na">－</span>取扱なし <span class="new">NEW</span>2週間以内に追加</span>
  </div>
  <div class="asw-scroll"><table><thead><tr id="asw-th"><th class="c-date">日程</th><th>クルーズ名</th></tr></thead><tbody id="asw-list"><tr><td colspan="5" class="asw-msg">読み込み中…</td></tr></tbody></table></div>
  <div class="asw-foot">記号は更新日時点の目安です。最新の空室・料金は各社で確認してください。どの会社でも申し込めなくなったクルーズは載せていません。</div>
</div>
<style>
.asw{font-size:12px;border:1px solid #c9d1da;border-radius:6px;overflow:hidden;background:#fff;margin:12px 0;color:#1d2733}
.asw-head{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#16324f;color:#fff;padding:5px 8px}
.asw-head b{font-size:13px}.asw-head span{font-size:11px;white-space:nowrap;opacity:.9}
.asw-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:5px 8px;border-bottom:1px solid #e1e6eb}
.asw-bar select{font-size:11px;padding:2px 4px;border:1px solid #e1e6eb;border-radius:4px;background:#fff}
.asw-hint{font-size:10px;color:#5d6b7a;width:100%}
.asw-lg{display:flex;gap:8px;color:#5d6b7a;font-size:11px;flex-wrap:wrap}
.asw-scroll{max-height:176px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.asw table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0}
.asw th{position:sticky;top:0;background:#dde7f3;font-weight:600;text-align:left;padding:3px 6px;border:0;border-bottom:1px solid #c9d1da;z-index:1}
.asw td{padding:3px 6px;border:0;border-bottom:1px solid #e1e6eb;vertical-align:middle}
.asw .c-date{width:112px;white-space:nowrap;font-size:11px}.asw .c-date br{display:none}
.asw .c-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asw .c-ag{width:52px;text-align:center}
.asw td a{display:block;text-decoration:none;font-weight:700;font-size:14px;border-radius:3px;line-height:1.5}
.asw .ok{color:#1a7f4b}.asw .few{color:#b06a00}.asw .ng{color:#8a8f96}.asw .ans{color:#0f6e8c}.asw .na{color:#b7bdc4}
.asw .port{display:inline-block;font-size:10px;color:#16324f;background:#e8eef5;border-radius:3px;padding:0 4px;margin-right:4px}
.asw .new{display:inline-block;font-size:9px;font-weight:700;color:#fff;background:#d6453d;border-radius:3px;padding:0 3px;margin-right:4px}
.asw .asw-msg{text-align:center;color:#5d6b7a;padding:12px}
.asw-foot{padding:3px 8px;font-size:10px;color:#5d6b7a;background:#fafbfc;border-top:1px solid #e1e6eb}
@media (max-width:480px){.asw .c-name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}.asw .c-date{width:62px}.asw .c-date br{display:inline}.asw .c-ag{width:40px}}
</style>
<script>
(function(){
  var FEED = 'https://kumarisucruise.github.io/cruise-widget-data/asuka3.json';
  var root = document.getElementById('asw');
  var page = root.getAttribute('data-page');
  var verb = page === 'asuka3-price' ? '料金と空室' : '空室';
  var MARK = {ok:'○', few:'△', ng:'✕', ans:'◇'};
  var WD = ['日','月','火','水','木','金','土'];
  var list = document.getElementById('asw-list');
  var selM = document.getElementById('asw-month');
  var selP = document.getElementById('asw-port');
  var firstFilter = true;
  var feed = null;
  var stale = false;
  document.getElementById('asw-hint').textContent = '記号をタップすると、各社の' + verb + 'のページを開きます';

  // 読み込み時には送らない（操作したときだけ）
  function track(name, params){
    if (typeof gtag === 'function') gtag('event', name, params);
  }
  function md(d){ return (d.getMonth()+1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
  function esc(s){ return String(s).replace(/[<>"]/g, function(c){ return {'<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function uniq(a){ return a.filter(function(v, i){ return a.indexOf(v) === i; }); }
  // データが書き換えられても、決まったASP以外（javascript: や知らないサイト）にはリンクしない
  var ALLOWED = ['https://t.afi-b.com/', 'https://px.a8.net/', 'https://ck.jp.ap.valuecommerce.com/'];
  function safeUrl(u){
    if (typeof u !== 'string') return null;
    return ALLOWED.some(function(p){ return u.indexOf(p) === 0; }) ? u : null;
  }

  function render(){
    var m = selM.value, p = selP.value;
    var rows = feed.cruises.filter(function(c){
      var okM = m ? c.depart.slice(0, 7) === m : true;
      var okP = p ? c.port === p : true;
      return okM ? okP : false;
    });
    var cols = feed.agents.length + 2;
    if (rows.length === 0) { list.innerHTML = '<tr><td colspan="' + cols + '" class="asw-msg">条件に合うクルーズはありません</td></tr>'; return; }
    list.innerHTML = '';
    rows.forEach(function(c){
      var s = new Date(c.depart + 'T00:00:00+09:00');
      var e = new Date(s.getTime() + (c.days - 1) * 864e5);
      var html = '<td class="c-date">' + md(s) + '-<br>' + md(e) + '</td>'
        + '<td class="c-name" title="' + esc(c.course) + '">' + (c['new'] ? '<span class="new">NEW</span>' : '')
        + '<span class="port">' + esc(c.port) + '</span>' + esc(c.course) + '</td>';
      feed.agents.forEach(function(a){
        var st = stale ? null : c.st[a.id];
        var url = safeUrl(c.link[a.id]);
        if (!url) { html += '<td class="c-ag na">－</td>'; return; }
        var label = st ? MARK[st] : '→';
        var cls = st ? st : 'na';
        html += '<td class="c-ag"><a class="' + cls + '" href="' + esc(url) + '" target="_blank" rel="nofollow sponsored noopener"'
          + ' data-agent="' + a.id + '" data-asp="' + a.asp + '" data-status="' + (st || 'stale') + '" data-date="' + c.depart + '"'
          + ' aria-label="' + esc(a.label) + 'で' + verb + 'を見る">' + label + '</a></td>';
      });
      var tr = document.createElement('tr');
      tr.innerHTML = html;
      list.appendChild(tr);
    });
  }

  function init(data){
    feed = data;
    var age = Math.round((Date.now() - Date.parse(feed.updated + 'T00:00:00+09:00')) / 864e5);
    stale = age > feed.staleDays;
    document.getElementById('asw-upd').textContent = stale
      ? '更新が止まっています。空室は各社で確認してください'
      : '空室は毎週更新・更新日 ' + feed.updated.replace(/-/g, '/');
    var th = document.getElementById('asw-th');
    feed.agents.forEach(function(a){
      var c = document.createElement('th'); c.className = 'c-ag'; c.textContent = a.label; th.appendChild(c);
    });
    uniq(feed.cruises.map(function(c){ return c.depart.slice(0, 7); })).forEach(function(v){
      selM.add(new Option(v.replace('-', '年') + '月', v));
    });
    uniq(feed.cruises.map(function(c){ return c.port; })).forEach(function(v){ selP.add(new Option(v + '発着', v)); });
    render();
  }

  function onFilter(ev){
    track('cruise_widget_filter', {ship: feed.ship, page: page, filter: ev.target.id === 'asw-month' ? 'month' : 'port', value: ev.target.value || 'all', first: firstFilter});
    firstFilter = false;
    render();
  }
  selM.addEventListener('change', onFilter);
  selP.addEventListener('change', onFilter);
  list.addEventListener('click', function(ev){
    var a = ev.target.closest('a[data-agent]');
    if (!a) return;
    track('cruise_widget_agent_click', {ship: feed.ship, page: page, agent: a.getAttribute('data-agent'), asp: a.getAttribute('data-asp'), status: a.getAttribute('data-status'), depart: a.getAttribute('data-date')});
  });

  fetch(FEED, {cache: 'no-cache'}).then(function(r){
    if (!r.ok) throw new Error('feed ' + r.status);
    return r.json();
  }).then(init).catch(function(){
    list.innerHTML = '<tr><td colspan="5" class="asw-msg">空室の表示を読み込めませんでした。'
      + '<a href="https://t.afi-b.com/visit.php?a=Q10113i-e4809260_h&amp;p=m9111287" target="_blank" rel="nofollow sponsored noopener" data-agent="his" data-asp="afb" data-status="error" data-date="">HISで飛鳥IIIの空室を見る</a></td></tr>';
  });
})();
</script>
